# glen-benchmark's Jobs use this name in-cluster; agents outside NRP use the
# public bench-ingress.yaml, which points here.
# Traffic goes through the HAProxy in bench-proxy.yaml, which gives each query
# to an idle bench pod.
apiVersion: v1
kind: Service
metadata:
  name: bench-mcp-server-duckdb
  namespace: biodiversity
spec:
  selector:
    app: bench-mcp-proxy
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
