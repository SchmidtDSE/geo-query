# CPU (DuckDB) MCP data server on the local k3s cluster (cirrus).
#
# Derived from the NRP prod recipe (deployment.yaml) but retargeted at the
# self-hosted cluster: it runs in the `mcp` namespace alongside gpu-mcp, is
# pinned to the cirrus node, and reads from the in-cluster MinIO mirror instead
# of NRP Ceph so all data traffic stays on-node. Ingress/TLS/DNS are handled by
# Traefik + cert-manager + external-dns (see cirrus-ingress.yaml).
#
# Locked down like prod (NRP incident, 2026-11-06):
# - bearer-token auth from the duckdb-mcp-auth Secret (one file per caller);
# - non-root, read-only root filesystem, no service-account token mounted;
# - every DuckDB connection runs dbconfig.lock_down() (built into the image);
# - cirrus-networkpolicy.yaml limits egress to in-cluster MinIO, DNS and AWS S3
#   us-west-2 (source.coop public data).
#
# The token Secret must exist before applying (never commit a token):
#   kubectl -n mcp create secret generic duckdb-mcp-auth \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      # Pin to cirrus: MinIO and Traefik both live on cirrus, so co-locating the
      # server keeps S3 reads on-node rather than crossing the 1Gb VXLAN wire.
      nodeSelector:
        kubernetes.io/hostname: cirrus
      # The server never calls the Kubernetes API; a mounted token was readable
      # through DuckDB in the 2026-11-06 incident.
      automountServiceAccountToken: false
      # Non-root, matching the image's app user (uid/gid 10001). fsGroup makes the
      # mounted token files readable by the app's group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      # Each key becomes /etc/mcp-tokens/<caller-name>. To add a caller, add a
      # key to the Secret and an item here.
      - name: mcp-tokens
        secret:
          secretName: duckdb-mcp-auth
          defaultMode: 0440
          items:
          - key: MCP_AUTH_TOKEN
            path: default
      # Spill space: the root filesystem is read-only.
      - name: tmp
        emptyDir:
          sizeLimit: 50Gi
      containers:
      - name: server
        # The v0.9.9 release (main at 194b6c0; includes #494-#496).
        # Pinned by digest so both replicas converge on one build. APP_VERSION
        # below must match the tag; CI checks it.
        image: ghcr.io/schmidtdse/geo-query:v0.9.9@sha256:cbe50b1ec305c0084b1a6a6c61482f434b1f1b2e61e2c81127e5be63b3e2defd
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_VERSION
          value: "v0.9.9"
        # Bearer-token auth (#43, #454): every route except /healthz and /version
        # (and public /tiles below) needs `Authorization: Bearer <token>`. The
        # server refuses to start if this directory holds no tokens.
        - name: MCP_AUTH_TOKENS_DIR
          value: /etc/mcp-tokens
        - name: MCP_AUTH_PUBLIC_TILES
          value: "true"
        # In-cluster MinIO mirror. STAC metadata + S3 data both resolve to the
        # on-node MinIO S3 endpoint (plain http, path-style).
        - name: STAC_CATALOG_URL
          value: "http://minio-svc.minio.svc.cluster.local:9000/public-data/stac/catalog.json"
        # Same catalog, external address, advertised by browse_stac_catalog and
        # GET /version (#346).
        - name: STAC_PUBLIC_CATALOG_URL
          value: "https://minio.carlboettiger.info/public-data/stac/catalog.json"
        # Reroute nrp_ceph STAC metadata fetches to in-cluster MinIO.
        - name: S3_ENDPOINT_URL
          value: "http://minio-svc.minio.svc.cluster.local:9000"
        # The mirror's STAC hrefs name its public host. Route both data reads
        # (→ s3://, default secret) and STAC-JSON fetches to in-cluster MinIO:
        # egress to the public host is blocked by cirrus-networkpolicy.yaml.
        - name: S3_SOURCES
          value: '[{"name":"minio","https_prefix":"https://minio.carlboettiger.info/","s3_prefix":"s3://","metadata_url_prefix":"http://minio-svc.minio.svc.cluster.local:9000/"}]'
        # DuckDB default `s3` secret: bare host, http, path-style for MinIO.
        - name: S3_DEFAULT_ENDPOINT
          value: "minio-svc.minio.svc.cluster.local:9000"
        - name: S3_DEFAULT_USE_SSL
          value: "false"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://duckdb-mcp.carlboettiger.info"
        # Boot even if the STAC catalog is briefly unreachable at startup (#260).
        - name: STAC_ALLOW_DEGRADED_START
          value: "true"
        # Pod's cgroup memory limit → DuckDB memory_limit (~80%) (#270).
        - name: POD_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.memory
        # Ephemeral-storage limit → DuckDB max_temp_directory_size (~50%) (#423).
        - name: POD_EPHEMERAL_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.ephemeral-storage
        volumeMounts:
        - name: mcp-tokens
          mountPath: /etc/mcp-tokens
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          # cirrus has 128 CPU / ~251Gi, shared with gpu-mcp and JupyterHub.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 96Gi
            cpu: 64
            ephemeral-storage: 50Gi
        ports:
        - containerPort: 8000
        # Readiness uses /readyz, which also fails while the pod has no STAC
        # catalog (#429) or is low on spill disk (#428), so the Service sends
        # requests to other replicas. Liveness stays on /healthz.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          # One failure takes the pod out within ~5 s, so a second heavy query
          # is less likely to land on a pod already draining (#428).
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
