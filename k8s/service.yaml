# Points at the HAProxy in proxy.yaml, which gives each query to an idle pod (#551).
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-duckdb
  namespace: biodiversity
spec:
  selector:
    app: duckdb-mcp-proxy
  ports:
    - protocol: TCP
      port: 8000        # The Service listens here
      targetPort: 8000  # The Pod listens here
