name: Copy images from the old package

# The repo moved from boettiger-lab/mcp-data-server to SchmidtDSE/geo-query on
# 2026-11-03 (boettiger-lab/glen-ops#233). GHCR packages do not move with a repo,
# so every image built before then lives only in ghcr.io/boettiger-lab/mcp-data-server.
#
# This copies them, byte for byte, into ghcr.io/schmidtdse/geo-query so a deployment
# can switch registry path without switching image: the digest is unchanged, and the
# job fails if a copy comes out with any other digest. It copies every release tag
# (vX.Y.Z), `experimental` and `gpu-arm64`, plus any untagged digests you list, which
# are tagged `sha256-<hex>` (the OCI fallback name for an untagged digest).
#
# Safe to re-run: a tag that already holds the same digest is skipped, and a tag that
# holds a different digest is never overwritten (release tags are immutable). Delete
# this workflow, and then the old package, once nothing pins the old path.

on:
  workflow_dispatch:
    inputs:
      digests:
        description: 'Untagged digests to copy too, space-separated (sha256:...)'
        required: false
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      OLD: ghcr.io/boettiger-lab/mcp-data-server
      NEW: ghcr.io/schmidtdse/geo-query
    steps:
      - name: Validate inputs
        env:
          DIGESTS: ${{ inputs.digests }}
        run: |
          for d in $DIGESTS; do
            echo "$d" | grep -Eq '^sha256:[0-9a-f]{64}$' \
              || { echo "::error::not a digest: $d"; exit 1; }
          done

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Copy
        env:
          DIGESTS: ${{ inputs.digests }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest
          }
          tok=$(curl -s "https://ghcr.io/token?scope=repository:boettiger-lab/mcp-data-server:pull" | jq -r .token)
          tags=$(curl -s -H "Authorization: Bearer $tok" \
            "https://ghcr.io/v2/boettiger-lab/mcp-data-server/tags/list?n=2000" \
            | jq -r '.tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") or . == "experimental" or . == "gpu-arm64")')
          [ -n "$tags" ] || { echo "::error::no tags read from $OLD"; exit 1; }

          # pairs of "<new tag> <source digest>"
          pairs=""
          for t in $tags; do
            src=$(digest_of "$OLD:$t")
            [ -n "$src" ] || { echo "::error::cannot resolve $OLD:$t"; exit 1; }
            pairs="$pairs$t $src"$'\n'
          done
          for d in $DIGESTS; do
            pairs="${pairs}sha256-${d#sha256:} $d"$'\n'
          done

          fail=0; copied=0; skipped=0
          while read -r tag src; do
            [ -n "$tag" ] || continue
            have=$(digest_of "$NEW:$tag" || true)
            if [ -n "$have" ]; then
              if [ "$have" = "$src" ]; then skipped=$((skipped+1)); continue; fi
              echo "::error::$NEW:$tag already holds $have, not $src; leaving it"
              fail=1; continue
            fi
            docker buildx imagetools create -t "$NEW:$tag" "$OLD@$src"
            got=$(digest_of "$NEW:$tag")
            if [ "$got" != "$src" ]; then
              echo "::error::$NEW:$tag is $got after the copy, expected $src"
              fail=1; continue
            fi
            echo "$tag $src" | tee -a copied.txt
            copied=$((copied+1))
          done <<< "$pairs"

          {
            echo "### Copied from \`$OLD\`"
            echo "$copied copied, $skipped already present."
            [ -f copied.txt ] && { echo '```'; cat copied.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
