# The Ingress sends dev traffic here, and this Service sends it to the HAProxy in
# dev-proxy.yaml, which gives each query to an idle dev pod (#551).
apiVersion: v1
kind: Service
metadata:
  name: dev-mcp-server-duckdb
  namespace: biodiversity
spec:
  selector:
    app: dev-mcp-proxy
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
