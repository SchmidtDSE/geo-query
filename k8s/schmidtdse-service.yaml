# Apps reach this server from their nginx at
# http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/mcp. Headless callers with
# their own key use the Ingress at https://geo-query.nrp-nautilus.io/mcp
# (schmidtdse-ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: duckdb-mcp
  namespace: schmidtdse
spec:
  selector:
    app: duckdb-mcp
  sessionAffinity: None
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
