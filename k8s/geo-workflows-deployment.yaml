# duckdb-mcp for the data-workflows agent (#479): a copy of the schmidtdse server
# in geo-workflows, the namespace where dataset builds run. It has no Ingress and
# admits no in-cluster callers (geo-workflows-networkpolicy.yaml). The agent runs
# off NRP and reaches it through the API server:
#
#   kubectl port-forward -n geo-workflows svc/duckdb-mcp 8000:8000
#
# It mounts no S3 credentials and reads only anonymously readable data, like prod.
# Never mount the namespace's `aws` or `rclone-config` Secrets here: they hold a
# key that can read, write and delete every bucket, and this server runs caller SQL.
#
# Needs the geo-workflows/duckdb-mcp-tokens Secret (key data-workflows) first.
# Apply geo-workflows-networkpolicy.yaml before this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: geo-workflows
spec:
  # One client, and a port-forward lands on one pod.
  replicas: 1
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      # The server never calls the Kubernetes API; a mounted token was readable
      # through DuckDB in the 2026-11-06 incident.
      automountServiceAccountToken: false
      # Non-root, matching the image's app user (uid 10001). fsGroup makes the
      # mounted token files readable by the app's group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: mcp-tokens
        secret:
          secretName: duckdb-mcp-tokens
          defaultMode: 0440
      # Spill space: the root filesystem is read-only. Capped at the namespace's
      # default ephemeral-storage limit (50Gi on NRP), stated here so the cap
      # doesn't depend on that default; past it the pod is evicted, not the node
      # filled. DuckDB stops each connection at half the pod limit before that.
      - name: tmp
        emptyDir:
          sizeLimit: 50Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      containers:
      - name: server
        image: ghcr.io/schmidtdse/geo-query:v0.9.10@sha256:d6c3637f4d7f1c3c63b46f587fb10150e730df16f07f5653ae758f3a94cc48db
        imagePullPolicy: IfNotPresent
        env:
        # Release identity is supplied HERE, not baked into the image (#413). The
        # image is built once from `main` and a release only adds a tag to that
        # existing manifest — so its own ENV still says "main", and this overrides
        # it. Keep this in step with the `:vX.Y.Z` in `image:` above; CI enforces
        # that they match (tests/check_k8s_image_pins.py). GIT_SHA is NOT overridden:
        # the image's own value is the commit it was built from, which stays correct
        # through a retag.
        - name: APP_VERSION
          value: "v0.9.10"
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        # NRP Ceph through its external https endpoint, not the internal RGW
        # (rook-ceph-rgw-nautiluss3.rook). The egress NetworkPolicy
        # (geo-workflows-networkpolicy.yaml) allows only DNS and public https until
        # NRP gives us a rule for internal RGW; then drop these two to return to
        # the much faster internal endpoint.
        - name: S3_DEFAULT_ENDPOINT
          value: "s3-west.nrp-nautilus.io"
        - name: S3_ENDPOINT_URL
          value: "https://s3-west.nrp-nautilus.io"
        # No public host: the agent sees the server at the local end of its
        # port-forward, so hex tile URLs come back on that address.
        - name: MCP_PUBLIC_BASE_URL
          value: "http://localhost:8000"
        # Bearer-token auth (#43, #454): every route except /healthz and /version
        # needs `Authorization: Bearer <token>`, /tiles included. Tokens come from
        # the geo-workflows/duckdb-mcp-tokens Secret mounted below, one key per
        # caller (data-workflows). The server reads tokens only at startup, so
        # adding or revoking a key needs a rollout restart.
        - name: MCP_AUTH_TOKENS_DIR
          value: /etc/mcp-tokens
        # Pod's cgroup memory limit → DuckDB memory_limit (~80%), so an oversized
        # query spills to /tmp instead of OOM-killing the replica and every
        # co-tenant query on it (#270).
        - name: POD_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.memory
        # Container's ephemeral-storage limit (unset here, so the namespace
        # LimitRange default — 50Gi on NRP) → DuckDB max_temp_directory_size (~50%
        # per connection), so an oversized spill fails its query instead of the
        # kubelet evicting the pod (#423).
        - name: POD_EPHEMERAL_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.ephemeral-storage
        volumeMounts:
        - name: mcp-tokens
          mountPath: /etc/mcp-tokens
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          # Requests intentionally kept small (≤2 GiB memory, ≤1 CPU) to land in
          # NRP's "Ignored" bucket for utilization violations. Limits stay high so
          # legitimate large queries (~100 GiB memory, multi-CPU) can still burst.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 160Gi
            cpu: 64
        ports:
        - containerPort: 8000
        # Probes exercise an actual HTTP request (GET /healthz) rather than a
        # bare TCP accept. Under a TCP-only probe a pod whose uvicorn event loop
        # is starved (e.g. by a runaway DuckDB query saturating CPU/memory) still
        # passes — the kernel accepts the connection regardless of whether the
        # app writes a response — and HAProxy keeps routing ~50% of traffic to a
        # wedged backend. See issue #157.
        # Readiness uses /readyz, which also fails while the pod has no STAC
        # catalog (#429) or is low on spill disk (#428), so the Service sends
        # requests to other replicas. Liveness stays on /healthz.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          # One failure takes the pod out within ~5 s, so a second heavy query
          # is less likely to land on a pod already draining (#428).
          failureThreshold: 1
        # Liveness restarts a chronically wedged pod (3 minutes of unresponsive
        # /healthz). Longer than readiness so a temporarily slow pod gets pulled
        # from the Service first; only a deeply stuck one is killed.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6

