# Testing endpoint for the :experimental image (raster + zarr extensions, issue #354).
# Not part of the prod or dev rotation — nothing should depend on this being up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experimental-duckdb-mcp
  namespace: biodiversity
spec:
  # Single replica on purpose: a testing endpoint on a shared cluster, and a
  # single pod keeps a test session pinned to one DuckDB process.
  replicas: 0  # Scaled down 2026-11-07: unused. Raise to 1 to bring it back.
  selector:
    matchLabels:
      app: experimental-duckdb-mcp
  template:
    metadata:
      labels:
        app: experimental-duckdb-mcp
    spec:
      # The server never calls the Kubernetes API; a mounted token was readable
      # through DuckDB in the 2026-11-06 incident.
      automountServiceAccountToken: false
      volumes:
      - name: mcp-tokens
        secret:
          secretName: duckdb-mcp-tokens
          defaultMode: 0400
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      containers:
      - name: server
        # ci-image-pin: allow-mutable — single-replica throwaway test endpoint
        # (replicas: 1, "nothing should depend on this"), so no cross-pod skew;
        # tracks the moving :experimental tag on purpose as extensions land (#354).
        image: ghcr.io/schmidtdse/geo-query:experimental
        imagePullPolicy: Always
        env:
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://experimental-duckdb-mcp.nrp-nautilus.io"
        # Bearer-token auth (#43, #454): every route except /healthz and /version
        # (and public /tiles below) needs `Authorization: Bearer <token>`. One
        # token per app namespace, from the duckdb-mcp-tokens Secret mounted
        # below: each key names the namespace, so one can be revoked alone. Apps
        # add their token server-side in their nginx.
        - name: MCP_AUTH_TOKENS_DIR
          value: /etc/mcp-tokens
        # Hex tiles stay public: their data is in the public-output bucket.
        - name: MCP_AUTH_PUBLIC_TILES
          value: "true"
        - name: STAC_ALLOW_DEGRADED_START
          value: "true"
        # Also baked into the image; set here too so `kubectl describe` shows which
        # extras a running pod believes it has without cracking open the image.
        - name: EXTRA_DUCKDB_EXTENSIONS
          value: "raster,zarr"
        # GDAL (vendored by the raster extension) looks for the RedHat CA path;
        # the image is Debian. Without this every /vsicurl/ read fails TLS. Also
        # set in the image — repeated here so it is visible and overridable.
        - name: GDAL_HTTP_CAINFO
          value: "/etc/ssl/certs/ca-certificates.crt"
        - name: CURL_CA_BUNDLE
          value: "/etc/ssl/certs/ca-certificates.crt"
        - name: POD_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.memory
        # Container's ephemeral-storage limit (unset here, so the namespace
        # LimitRange default — 50Gi on NRP) → DuckDB max_temp_directory_size (~50%
        # per connection), so an oversized spill fails its query instead of the
        # kubelet evicting the pod (#423).
        - name: POD_EPHEMERAL_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.ephemeral-storage
        volumeMounts:
        - name: mcp-tokens
          mountPath: /etc/mcp-tokens
          readOnly: true
        resources:
          # Small requests (NRP's "Ignored" utilization bucket), and limits well
          # below prod's 160Gi/64: this endpoint is for small rasters and Zarr
          # slices. RT_ReadCells materializes every pixel, so a modest ceiling is
          # a feature — an over-large read fails here instead of evicting
          # co-tenants on the node.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 32Gi
            cpu: 16
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
