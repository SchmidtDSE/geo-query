# In-cluster only: the benchmark server has no Ingress (bench-deployment.yaml).
# Traffic goes through the HAProxy in bench-proxy.yaml, which gives each query
# to an idle bench pod.
apiVersion: v1
kind: Service
metadata:
  name: bench-mcp-server-duckdb
  namespace: biodiversity
spec:
  selector:
    app: bench-mcp-proxy
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
